plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.farred.fayyadhos.tv.jarvis.fix'
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '3.2.0-glass-dusk'
    }

    signingConfigs {
        debug {
            // Optional durable test key, never bundled in source archives.
            if (System.getenv('FAYYADHOS_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('FAYYADHOS_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            storeFile file(System.getenv('FAYYADHOS_RELEASE_KEYSTORE') ?: "${rootProject.projectDir}/signing/release.jks")
            storePassword System.getenv('FAYYADHOS_RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('FAYYADHOS_RELEASE_ALIAS')
            keyPassword System.getenv('FAYYADHOS_RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Dedicated release key; credentials supplied via environment variables.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}

dependencies { testImplementation 'org.json:json:20240303' }

android {
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies { testImplementation 'org.robolectric:robolectric:4.17' }

// Canonical artwork is text-encoded for the repository transport, decoded once at build time.
// Only .webp binaries are packaged in the APK; no runtime decoder or extra dependency.
def premiumAssetDir = layout.buildDirectory.dir('generated/premiumAssets')
def generatePremiumAssets = tasks.register('generatePremiumAssets') {
    inputs.dir(rootProject.file('art/premium'))
    outputs.dir(premiumAssetDir)
    doLast {
        def target = new File(premiumAssetDir.get().asFile, 'premium')
        target.mkdirs()
        rootProject.file('art/premium').eachFileMatch(~/.*\.webp\.b64/) { source ->
            new File(target, source.name.replace('.b64', '')).bytes = source.text.trim().decodeBase64()
        }
    }
}
android.sourceSets.main.assets.srcDir(premiumAssetDir)
tasks.named('preBuild').configure { dependsOn(generatePremiumAssets) }
