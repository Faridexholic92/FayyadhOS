name: Kids Universe Test APK

on:
  push:
    branches:
      - design/kids-universe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Rename test APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FayyadhOS-Kids-Universe-v2.10.0-test.apk
          sha256sum dist/FayyadhOS-Kids-Universe-v2.10.0-test.apk > dist/SHA256SUMS.txt
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FayyadhOS-Kids-Universe-test-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 14
