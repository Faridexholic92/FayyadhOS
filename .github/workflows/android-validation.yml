name: Android validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check resource, source and executable-bit invariants
        run: python3 tools/check-build-inputs.py --require-executable
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install exact Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Clean build, regression tests, lint and actual DEX audit
        run: bash build-verified-debug.sh
      # Debug builds remain internal validation outputs. Never distribute an
      # ephemeral runner-signed APK as an update to an existing installation.
      # Re-enable APK publication only through a separately reviewed release
      # flow with the established signing key and physical-device acceptance.
      - name: Keep unsigned-for-production test builds internal
        if: success()
        run: echo 'Validation only. No APK is published; owner-controlled signing and device acceptance are required.'
      - name: Upload test and lint reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: warn
