# Temporary bootstrap only: GitHub's file-content API cannot express Git executable modes.
# Removed after its one-purpose commit has been verified. No production/default-branch writes.
name: Repair script executable modes
on:
  push:
    branches: ['fix/2.9.1-build-stability']
    paths: ['.github/workflows/repair-script-modes.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/2.9.1-build-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/2.9.1-build-stability
      - name: Commit executable bits on the repair branch only
        shell: bash
        run: |
          chmod +x gradlew build-verified-debug.sh build-fayyadhos-tv.sh
          git add --chmod=+x -- gradlew build-verified-debug.sh build-fayyadhos-tv.sh
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: restore executable modes on launcher build scripts'
          git push origin HEAD:refs/heads/fix/2.9.1-build-stability
